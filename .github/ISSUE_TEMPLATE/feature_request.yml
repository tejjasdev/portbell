name: Feature request
description: Suggest an improvement
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        portbell does one job: show incoming HTTP requests and let you choose the reply.
        Please read the non-goals in the [README](https://github.com/tejjasdev/portbell/blob/main/README.md#what-it-is-not) first.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
